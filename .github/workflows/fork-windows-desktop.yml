name: Fork Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - feat/win-desktop

concurrency:
  group: fork-windows-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      T3CODE_BUILD_BUNDLE_MUTAGEN: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      T3CODE_BUILD_DISABLE_AUTO_UPDATE: "1"
      T3CODE_BUILD_LOCAL_ENVIRONMENT_DEFAULT_OFF: "1"
      T3CODE_DESKTOP_SIGNED: "false"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      # Match release-desktop's checkout, excluding the vendored gitlinks.
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Setup Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.27.3"
          cache: false

      - name: Prepare Mutagen and native SSH shims
        shell: pwsh
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -buildvcs=false
          GOOS: windows
          GOARCH: amd64
        run: |
          $ErrorActionPreference = "Stop"
          $destination = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/prod-resources/mutagen"
          New-Item -ItemType Directory -Force $destination | Out-Null
          go -C native/sync-ssh-shim build -trimpath -o "$destination/ssh.exe" .
          if ($LASTEXITCODE -ne 0) { throw "SSH shim compilation failed" }
          Copy-Item "$destination/ssh.exe" "$destination/scp.exe"
          $archive = Join-Path $env:RUNNER_TEMP "mutagen.zip"
          Invoke-WebRequest "https://github.com/mutagen-io/mutagen/releases/download/v0.18.1/mutagen_windows_amd64_v0.18.1.zip" -OutFile $archive
          $expected = "76f8223d5e6b607efdd9516473669ae5492e4f142887352d59bc6934d1f07a2d"
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw "Mutagen archive SHA256 mismatch"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $entry = $zip.GetEntry("mutagen.exe")
            if ($null -eq $entry) { throw "mutagen.exe missing from verified archive" }
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "$destination/mutagen.exe", $true)
          } finally { $zip.Dispose() }

      # Also install web dependencies: this job builds the JS bundle locally.
      - name: Install build dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe
          key: resource-monitor-x86_64-pc-windows-msvc-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Resolve fork version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(node -p "require('./apps/desktop/package.json').version")"
          echo "version=${base_version}-fork.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      - name: Install Spectre-mitigated MSVC libs
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      # Runs the upstream web -> server -> Electron build with the update flag.
      - name: Build JS bundle
        run: vp run build:desktop

      # Pure remote use needs no embedded Linux CLI archive for a local WSL backend.
      # The packaging script invokes electron-builder with --publish never.
      - name: Build unsigned Windows x64 NSIS installer
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
        run: vp run dist:desktop:artifact --platform win --target nsis --arch x64 --build-version "${{ steps.version.outputs.version }}" --skip-build --verbose

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t3code-${{ steps.version.outputs.version }}-windows-x64-nsis
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
